services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: matchme-db
    restart: always
    environment:
      POSTGRES_USER: matchme_user
      POSTGRES_PASSWORD: matchme-password
      POSTGRES_DB: matchme
      TZ: Europe/Tallinn
      PGTZ: Europe/Tallinn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - matchme-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchme_user -d matchme"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matchme-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/matchme
      SPRING_DATASOURCE_USERNAME: matchme_user
      SPRING_DATASOURCE_PASSWORD: matchme-password
      JWT_ACCESS_SECRET: matchme-access-key-need-to-be-at-least-32-characters
      JWT_REFRESH_SECRET: matchme-refresh-key-need-to-be-at-least-32-characters
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # Enable DevTools hot reload
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      # uncomment the line below to automatically seed 100 users w docker compose up
      SPRING_PROFILES_ACTIVE: seed
    volumes:
      - ./backend/uploads:/app/uploads
      # Mount source code for hot reload
      - ./backend/src:/app/src
      - ./backend/target:/app/target
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - matchme-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matchme-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules  # Prevent overwriting node_modules
    depends_on:
      - backend
    networks:
      - matchme-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: matchme-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matchme.com
      PGADMIN_DEFAULT_PASSWORD: adminho
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy  # ← pgAdmin waits for healthy PostgreSQL
    networks:
      - matchme-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  matchme-network:
    driver: bridge