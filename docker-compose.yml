services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: matchme-db
    restart: always
    environment:
      POSTGRES_USER: matchme_user
      POSTGRES_PASSWORD: matchme-password
      POSTGRES_DB: matchme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - matchme-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchme_user -d matchme"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matchme-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      # Database connection - uses Docker service name 'postgres'
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/matchme
      SPRING_DATASOURCE_USERNAME: matchme_user
      SPRING_DATASOURCE_PASSWORD: matchme-password
      
      # JWT secrets
      JWT_ACCESS_SECRET: matchme-access-key-need-to-be-at-least-32-characters
      JWT_REFRESH_SECRET: matchme-refresh-key-need-to-be-at-least-32-characters
      
      # CORS - allow requests from frontend
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      # Mount uploads directory to persist files
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - matchme-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matchme-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - matchme-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: matchme-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matchme.com
      PGADMIN_DEFAULT_PASSWORD: adminho
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy  # ← pgAdmin waits for healthy PostgreSQL
    networks:
      - matchme-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  matchme-network:
    driver: bridge