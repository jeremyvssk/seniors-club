services:
  postgres:
    image: postgres:16
    container_name: matchme-db
    restart: always
    environment:
      POSTGRES_USER: matchme_user
      POSTGRES_PASSWORD: matchme-password
      POSTGRES_DB: matchme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: matchme-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data: