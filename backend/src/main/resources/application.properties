# Database Configuration - uses environment variables for Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/matchme}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:matchme_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:matchme-password}


# JPA Configuration (replaces Prisma migrations) 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Store timestamps in UTC in database
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Send timestamps as ISO-8601 with timezone info
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX

# JWT Secrets - uses environment variables
jwt.access.secret=${JWT_ACCESS_SECRET:matchme-access-key-need-to-be-at-least-32-characters}
jwt.access.expiration=3600000
jwt.refresh.secret=${JWT_REFRESH_SECRET:matchme-refresh-key-need-to-be-at-least-32-characters}
jwt.refresh.expiration=604800000

# Server Port (replaces PORT in .env)
server.port=3001

# CORS Configuration - uses environment variables
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# File upload configuration
file.upload-dir=uploads

# Multipart file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB

# Tomcat multipart configuration
server.tomcat.max-http-post-size=-1
server.tomcat.max-swallow-size=10MB
server.tomcat.max-part-count=30

# Logging
logging.level.root=INFO
logging.level.com.matchme.backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=TRACE
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
