# Database Configuration (replaces DATABASE_URL in .env)
spring.datasource.url=jdbc:postgresql://localhost:5432/matchme
spring.datasource.username=matchme_user
spring.datasource.password=matchme-password

# JPA Configuration (replaces Prisma migrations)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Secrets (replaces .env JWT secrets)
jwt.access.secret=matchme-access-key-need-to-be-at-least-32-characters
jwt.access.expiration=900000
jwt.refresh.secret=matchme-refresh-key-need-to-be-at-least-32-characters
jwt.refresh.expiration=604800000

# Server Port (replaces PORT in .env)
server.port=3001

# CORS Configuration
cors.allowed.origins=http://localhost:5173

# File upload configuration
file.upload-dir=uploads

# Multipart file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB

# Tomcat multipart configuration
server.tomcat.max-http-post-size=-1
server.tomcat.max-swallow-size=10MB
server.tomcat.max-part-count=30

# Logging
logging.level.root=INFO
logging.level.com.matchme.backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=TRACE
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n