# Database Configuration (replaces DATABASE_URL in .env)
spring.datasource.url=jdbc:postgresql://localhost:5432/matchme
spring.datasource.username=matchme_user
spring.datasource.password=matchme-password

# JPA Configuration (replaces Prisma migrations)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Secrets (replaces .env JWT secrets)
jwt.access.secret=matchme-access-key-need-to-be-at-least-32-characters
jwt.access.expiration=900000
jwt.refresh.secret=matchme-refresh-key-need-to-be-at-least-32-characters
jwt.refresh.expiration=604800000

# Server Port (replaces PORT in .env)
server.port=3001

# CORS Configuration
cors.allowed.origins=http://localhost:5173